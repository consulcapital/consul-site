<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Consul" />
    <meta name="theme-color" content="#000000" />
    <title>Consul</title>
    <link rel="icon" href="consul-logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LQR73SPG6X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LQR73SPG6X');
    </script>
    <!-- Track mailto: link clicks in GA4 -->
    <script>
      document.addEventListener('click', function (event) {
        var link = event.target.closest('a[href^="mailto:"]');
        if (!link) return;
        gtag('event', 'mailto_click', { mailto_href: link.getAttribute('href') });
      });
    </script>
  </head>
  <body>
    <main class="page">
      <div class="emblem" aria-hidden="true">
        <div class="consul-mark"></div>
      </div>

      <section class="content" aria-labelledby="firm-name">
        <h1 id="firm-name">CONSUL</h1>
        <a class="contact" href="mailto:consul@consul.capital">Contact <span aria-hidden="true">⟶</span></a>
      </section>
    </main>
  </body>
</html>
